<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOMORA CUSTOM</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; font-family: Arial, "Noto Sans KR", sans-serif; color: #222; }
    body { background: #f4f4f4; }
    .app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 100vh; }
    #canvas-container { position: relative; min-height: 100vh; overflow: hidden; background: #f4f4f4; }
    #canvas-container canvas { display: block; width: 100%; height: 100%; }
    .panel { padding: 22px; background: #fff; border-left: 1px solid #e5e5e5; overflow-y: auto; max-height: 100vh; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .subtitle { margin: 0 0 24px; font-size: 12px; color: #888; }
    .section { margin: 0 0 24px; }
    .section-title { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
    .option-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .option-card { position: relative; min-height: 68px; padding: 12px 10px; border: 1px solid #ddd; border-radius: 10px; background: #fff; text-align: left; cursor: pointer; color: #222; }
    .option-card:hover { border-color: #999; }
    .option-card.active { border: 2px solid #222; padding: 11px 9px; }
    .option-name { display: block; font-size: 13px; font-weight: 600; }
    .option-price { display: block; margin-top: 5px; font-size: 12px; color: #888; }
    .selected-slot-info { margin: 0 0 10px; font-size: 12px; color: #666; }
    .slot-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
    .slot-button { border: 1px solid #ddd; border-radius: 8px; background: #fff; padding: 10px 0; cursor: pointer; }
    .slot-button.active { color: #fff; background: #222; border-color: #222; }
    .note { font-size: 12px; line-height: 1.6; color: #888; }
    
.price-row,
.price-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
  font-size: 13px;
}

.price-row strong {
  font-weight: 600;
  text-align: right;
}

.price-total {
  margin-top: 8px;
  padding: 16px 0;
  border-bottom: none;
  font-size: 15px;
  font-weight: 700;
}

.price-total strong {
  font-size: 20px;
}


/* 축 선택: 세로 리스트 */
#switchOptions {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

#switchOptions .option-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 52px;
    padding: 12px 14px;
    text-align: left;
}

#switchOptions .option-card.active {
    padding: 11px 13px;
}

#switchOptions .option-price {
    margin-top: 0;
    margin-left: 12px;
    white-space: nowrap;
}


/* 키캡 동그란 컬러 카드 */
.keycap-color-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.keycap-color-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    padding: 8px 4px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
}

.keycap-color-card.active {
    border-color: #222;
    background: #f8f8f8;
}

.keycap-color-circle {
    display: block;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.12);
}

.keycap-color-name {
    font-size: 12px;
    color: #444;
}



@media (max-width: 760px) {
    #keycapShapeOptions {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }

    #keycapShapeOptions::-webkit-scrollbar {
        display: none;
    }

    #keycapShapeOptions .option-card {
        flex: 0 0 150px;
    }
}


/* =========================================
   모바일 옵션 가로 탭
========================================= */

.mobile-option-tabs {
    display: none;
}

@media (max-width: 900px) {
    .app {
        display: flex;
        flex-direction: column;
    }

    #canvas-container {
        width: 100%;
        min-height: 42vh;
        height: 42vh;
        flex: 0 0 42vh;
    }

    .panel {
        width: 100%;
        max-height: none;
        min-width: 0;
        padding: 16px;
        overflow: visible;
        border-left: none;
    }

    .mobile-option-tabs {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        width: 100%;
        margin: 0 0 20px;
        padding: 0 0 8px;
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        border-bottom: 1px solid #e5e5e5;
    }

    .mobile-option-tabs::-webkit-scrollbar {
        display: none;
    }

    .mobile-option-tab {
        flex: 0 0 auto;
        padding: 10px 13px;
        border: 1px solid #ddd;
        border-radius: 20px;
        background: #fff;
        color: #555;
        font-size: 13px;
        white-space: nowrap;
        cursor: pointer;
    }

    .mobile-option-tab.active {
        border-color: #222;
        background: #222;
        color: #fff;
    }

    .panel > .section.mobile-section-hidden {
        display: none !important;
    }

    .panel > .section.mobile-section-active {
        display: block !important;
    }
}

/* PC에서는 기존 옵션 배치 유지 */
@media (min-width: 901px) {
    .mobile-option-tabs {
        display: none !important;
    }
}


/* PC에서는 탭을 표시하지 않고 기존 레이아웃 유지 */
.mobile-option-tabs {
    display: none;
}

@media screen and (max-width: 760px) {
    .mobile-option-tabs {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        gap: 8px;
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        padding: 0 0 10px;
        margin: 0 0 20px;
        border-bottom: 1px solid #eee;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }

    .mobile-option-tabs::-webkit-scrollbar {
        display: none;
    }

    .mobile-option-tab {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border: 1px solid #ddd;
        border-radius: 20px;
        background: #fff;
        color: #444;
        font-size: 13px;
        white-space: nowrap;
        cursor: pointer;
    }

    .mobile-option-tab.active {
        background: #222;
        color: #fff;
        border-color: #222;
    }

    .panel > .section.mobile-section-hidden {
        display: none !important;
    }

    .panel > .section.mobile-section-active {
        display: block !important;
    }
}


/* =========================================
   모바일: 모든 옵션 탭 내부 목록 스크롤
   ========================================= */


/* =========================================
   모바일: 옵션 목록 내부 스크롤
   기존 화면 레이아웃 유지
========================================= */

@media screen and (max-width: 900px) {

    /* 파츠 목록과 동일하게 세로 스크롤 */
    #partsOptions,
    #switchOptions,
    #keycapColorSection .option-grid,
    #allKeycapColorSection .option-grid,
    #keycapColorSection .keycap-color-grid,
    #allKeycapColorSection .keycap-color-grid {
        max-height: 40vh;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
        touch-action: pan-y;
    }

    /* 키캡 모양 목록은 기존 가로 배치 유지 */
    #keycapShapeOptions {
        max-height: none;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x;
    }
}

  
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>


</head>
<body>

    <div id="canvas-container" aria-label="3D 제품 미리보기"></div>

    
<aside class="panel">
  <header>
    <h1>CHRISTMAS CUSTOM(~12/31)</h1>
  </header>

  <!-- 모바일 전용 가로 카테고리 탭 -->
  <nav
    id="mobileOptionTabs"
    class="mobile-option-tabs"
    aria-label="옵션 카테고리">
  </nav>

      
      <section class="section">
        <h2 class="section-title">케이스 선택</h2>
        <div class="option-grid">
          <button class="option-card active" type="button" data-base="cm_case.glb" onclick="window.selectBase(this)">
            <span class="option-name">베이직</span><span class="option-price">₩26,000</span>
          </button>
          
        </div>
      </section>


      
<!-- 키캡 모양 선택 -->
<section class="section" id="keycapShapeSection">
    <h2 class="section-title">키캡 모양 선택</h2>

    <div class="option-grid" id="keycapShapeOptions">

        <button
            class="option-card active"

            data-keycap-shape="default">

        </button>

        <button
            class="option-card"
            type="button"
            data-keycap-shape="cap_gift">
            <span class="option-name">선물 키캡(1회선택가능)</span>
        </button>

        <button
            class="option-card"
            type="button"
            data-keycap-shape="cap_santa_7">
            <span class="option-name">산타 키캡(굴뚝전용)</span>
        </button>

        <button
            class="option-card"
            type="button"
            data-keycap-shape="cap_santa_w_7">
            <span class="option-name">산타 키캡W(굴뚝전용)</span>
        </button>        

    </div>
</section>


      




<section class="section" id="keycapColorSection">
    <h2 class="section-title">키캡 색상</h2>

    <div class="keycap-color-grid">

        <button
    class="keycap-color-card"
    type="button"
    data-keycap-color="#ffffff"
    aria-label="화이트"
    title="화이트"
    onclick="window.changeKeycapColor('#ffffff', this)">
    <span
        class="keycap-color-circle"

    </span>
</button>

<button
    class="keycap-color-card"
    type="button"
    data-keycap-color="#694822"
    aria-label="브라운"
    title="브라운"
    onclick="window.changeKeycapColor('#7B543B', this)">
    <span
        class="keycap-color-circle"
        style="background-color: #7B543B;">
    </span>
</button>

        

    </div>
</section>


 <section class="section" id="allKeycapColorSection">
    <h2 class="section-title">전체 키캡 색상</h2>

    <div class="keycap-color-grid">

        <button

                  style="background-color: #7B543B;"></span>

    </div>
</section>






<section class="section" id="partsSection">

          <button class="option-card active" type="button" data-part="all-none" onclick="window.selectPart('all-none')">

  <!-- 축 선택 -->

        </button>

        <button class="option-card"
                type="button"

        <button class="option-card"
                type="button"
                data-switch="pinksalt"

    </div>
</section>

<section class="section" id="priceSummarySection">

  <div class="price-row">
    <span>베이스</span>
    <strong id="basePrice">26,000원</strong>
  </div>

  
<div class="price-row">
    <span>키캡</span>
    <span id="keycapPrice">2,000원</span>
</div>
 

  <div class="price-row">
    <span>파츠 및 토핑</span>
    <strong id="partPrice">0원</strong>
  </div>

  <div class="price-row">
    <span>스위치</span>
    <strong id="switchPrice">-</strong>
  </div>

  <div class="price-total">

  </div>
</section>


    </aside>
  </main>

  <script type="module" src="./app_cm.js"></script>
  

  
<script>
(() => {
    const panel = document.querySelector('.panel');
    const tabs = document.getElementById('mobileOptionTabs');

    if (!panel || !tabs) return;

    // 각 탭과 연결할 기존 옵션 섹션
    const sections = Array.from(
        panel.querySelectorAll(':scope > .section')
    );

    const categories = sections
        .map((section, index) => {
            const heading = section.querySelector('.section-title');

            if (!heading) return null;

            return {
                section,
                index,
                title: heading.textContent.trim()
            };
        })
        .filter(Boolean);

    if (!categories.length) return;

    let activeIndex = 0;

    categories.forEach((category, index) => {
        const button = document.createElement('button');

        button.type = 'button';
        button.className = 'mobile-option-tab';
        button.textContent = category.title;

        button.addEventListener('click', () => {
            activeIndex = index;
            updateTabs();
        });

        tabs.appendChild(button);
    });

    function updateTabs() {
        const isMobile = window.matchMedia(
            '(max-width: 900px)'
        ).matches;

        const buttons = tabs.querySelectorAll(
            '.mobile-option-tab'
        );

        categories.forEach((category, index) => {
            const isActive = index === activeIndex;

            buttons[index].classList.toggle(
                'active',
                isActive
            );

            if (isMobile) {
                category.section.classList.toggle(
                    'mobile-section-active',
                    isActive
                );

                category.section.classList.toggle(
                    'mobile-section-hidden',
                    !isActive
                );
            } else {
                category.section.classList.remove(
                    'mobile-section-active',
                    'mobile-section-hidden'
                );
            }
        });
    }

    updateTabs();

    window.addEventListener('resize', updateTabs);
})();
</script>

  
</body>
